<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея Отца</title>
    <style>
        /* Весь твой предыдущий стиль с анимированным фоном */
        body {
            margin: 0; padding: 20px;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            font-family: sans-serif; min-height: 100vh;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        h1 {
            color: white; text-align: center; font-size: 3rem;
            margin-bottom: 40px; text-shadow: 2px 4px 10px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 15px;
            position: relative; left: 50%; transform: translateX(-50%);
            display: inline-block;
        }
        .grid { margin: 0 auto; max-width: 1400px; }
        .grid-item { width: 31%; margin-bottom: 25px; }
        .grid-item img {
            width: 100%; display: block; border-radius: 15px;
            border: 3px solid rgba(255,255,255,0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .grid-item img:hover { transform: scale(1.05); border-color: white; }
        @media (max-width: 900px) { .grid-item { width: 48%; } }
        @media (max-width: 500px) { .grid-item { width: 100%; } }
    </style>
</head>
<body>

    <h1>Галерея Vadonis</h1>
    <div class="grid" id="gallery-grid">
        </div>

    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>

    <script>
        const gridElement = document.getElementById('gallery-grid');

        // Читаем список файлов, который создаст робот
        fetch('images.json')
            .then(response => response.json())
            .then(images => {
                images.forEach(imgName => {
                    const div = document.createElement('div');
                    div.className = 'grid-item';
                    div.innerHTML = `<img src="images/${imgName}" alt="Art">`;
                    gridElement.appendChild(div);
                });

                // Запускаем Masonry после загрузки картинок
                imagesLoaded(gridElement, function() {
                    new Masonry(gridElement, {
                        itemSelector: '.grid-item',
                        percentPosition: true,
                        gutter: 25
                    });
                });
            })
            .catch(err => console.error("Файл images.json еще не создан роботом или пуст"));
    </script>
</body>
</html>
